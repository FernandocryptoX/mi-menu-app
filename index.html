<html lang="es">

<title>Mi Menú</title>
<style>
:root{--fs:22px;--bg:#fbf7ef;--card:#ffffff;--ink:#1f2a24;--muted:#55635b;--brand:#2f6b4f;--brand-ink:#ffffff;--soft:#e4f0e8;--warn:#fff1d6;--warn-ink:#6b4400;--line:#d8d2c4;--bad:#a4281d;--ok:#1d7a3e}
:root[data-contrast="high"]{--bg:#000;--card:#111;--ink:#fff;--muted:#e8e8e8;--brand:#ffd400;--brand-ink:#000;--soft:#222;--warn:#332600;--warn-ink:#ffe08a;--line:#fff;--bad:#ff8a80;--ok:#7dff9a}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.35;-webkit-text-size-adjust:100%}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:640px;margin:0 auto;padding:16px 16px 120px}
h1{font-size:1.5rem;margin:.2em 0 .3em;line-height:1.15}
h2{font-size:1.15rem;margin:1.1em 0 .4em}
.sub{color:var(--muted);font-size:.8rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}
.hero{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.hero .sub{color:inherit;opacity:.9}
.btn{display:block;width:100%;min-height:56px;border-radius:16px;border:2px solid var(--brand);background:var(--brand);color:var(--brand-ink);font-weight:700;padding:10px 14px;margin:8px 0;text-align:center}
.btn.alt{background:var(--card);color:var(--brand)}
.hero .btn{background:var(--brand-ink);color:var(--brand);border-color:var(--brand-ink)}
:root[data-contrast="high"] .btn.alt{color:var(--brand)}
.btn.small{min-height:44px;font-size:.8rem;display:inline-block;width:auto;margin:4px 6px 4px 0}
.btn.danger{background:var(--card);color:var(--bad);border-color:var(--bad)}
.row{display:flex;gap:10px;align-items:center}
.row>.grow{flex:1;min-width:0}
.chip{display:inline-block;border:2px solid var(--line);border-radius:999px;padding:8px 14px;margin:4px 6px 4px 0;background:var(--card);min-height:44px;font-size:.85rem}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.chip.off{border-color:var(--bad);color:var(--bad)}
.meal{display:flex;gap:12px;align-items:center}
.meal .ico{font-size:1.8rem;width:2.2rem;text-align:center}
.meal.done{opacity:.75;background:var(--soft)}
.meal .name{font-weight:700}
.check{width:60px;height:60px;border-radius:16px;border:3px solid var(--brand);background:var(--card);font-size:1.7rem;color:var(--brand);flex:none}
.check.on{background:var(--brand);color:var(--brand-ink)}
.tag{display:inline-block;background:var(--soft);border-radius:8px;padding:2px 8px;font-size:.75rem;margin-right:6px}
.notice{background:var(--warn);color:var(--warn-ink);border-radius:14px;padding:12px;margin:12px 0;font-size:.8rem}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;border:0;background:none;padding:8px 2px;min-height:68px;font-size:.62rem;font-weight:700;color:var(--muted)}
nav button .i{display:block;font-size:1.5rem}
nav button.on{color:var(--brand);box-shadow:inset 0 4px 0 var(--brand)}
.modal{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:12px 16px 40px}
.modal>.in{max-width:640px;margin:0 auto}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet>.in{background:var(--bg);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:16px;max-height:92vh;overflow:auto}
ol.steps{padding-left:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 12px 12px 56px;margin:8px 0;position:relative}
ol.steps li::before{content:counter(s);position:absolute;left:10px;top:10px;width:34px;height:34px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font-weight:800;display:flex;align-items:center;justify-content:center}
ul.ing{list-style:none;padding:0;margin:0}
ul.ing li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
ul.ing .q{font-weight:700;white-space:nowrap}
.shop{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.shop input{width:30px;height:30px;flex:none;accent-color:var(--brand)}
.shop.got{text-decoration:line-through;opacity:.55}
.toast{position:fixed;left:12px;right:12px;top:12px;z-index:40;background:var(--brand);color:var(--brand-ink);border-radius:16px;padding:14px;font-weight:700;max-width:616px;margin:0 auto;box-shadow:0 6px 20px rgba(0,0,0,.3)}
select,input[type=time],input[type=text],input[type=number],textarea{width:100%;min-height:48px;border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--card);margin:4px 0}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:52px;height:52px;border-radius:14px;border:2px solid var(--brand);background:var(--card);color:var(--brand);font-size:1.4rem;font-weight:800}
.stepper b{min-width:3.2em;text-align:center}
.bar{height:14px;border-radius:7px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{font-size:1.6rem;font-weight:800}
details{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 12px;margin:8px 0}
summary{min-height:48px;display:flex;align-items:center;font-weight:700;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:.75rem}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.demo{background:var(--soft);border-radius:10px;padding:6px 10px;font-size:.75rem;margin:6px 0}
:focus-visible{outline:4px solid #f59e0b;outline-offset:2px}
</style>
</head>

const KEY="mimenu_v1";
const DEF={settings:{name:"",meals:5,portion:1,people:1,maxDif:2,excluded:["tomate"],times:{desayuno:"07:30",media:"10:30",comida:"13:45",merienda:"16:45",cena:"19:45"},remind:{on:false,lead:10},font:3,contrast:false,pin:"1234"},log:{},weights:[],overrides:{},subs:{},shop:{},adaptLog:[],demo:true};

 S=JSON.parse(JSON.stringify(DEF));seedDemo();save()}

/* ---------- 5. FECHAS ---------- */
const pad=n=>String(n).padStart(2,"0");
const dk=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const addD=(k,n)=>{const d=pd(k);d.setDate(d.getDate()+n);return dk(d)};
const DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const longDate=k=>{const d=pd(k);return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`};
const today=()=>dk(new Date());
const mondayOf=k=>{const d=pd(k);return addD(k,-((d.getDay()+6)%7))};

/* ---------- 6. PLAN SEMANAL (automático, determinista y editable) ---------- */
const hasExcluded=r=>r.ing.some(([k])=>S.settings.excluded.includes(k));
function pool(slot){let p=R.filter(r=>r.slot===slot&&!hasExcluded(r));let q=p.filter(r=>r.dif<=S.settings.maxDif);return q.length?q:(p.length?p:R.filter(r=>r.slot===slot))}
function activeSlots(){const m=S.settings.meals;return m>=5?ORDER:m===4?["desayuno","comida","merienda","cena"]:["desayuno","comida","cena"]}
function recipe(id){return R.find(r=>r.id===id)}
function planFor(k){const d=pd(k);const dow=(d.getDay()+6)%7;const wk=Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5-dow)/7);const out={};
 for(const s of activeSlots()){const ov=S.overrides[k]&&S.overrides[k][s];if(ov&&recipe(ov)){out[s]=recipe(ov);continue}const p=pool(s);out[s]=p[(wk*3+dow+OFF[s])%p.length]}return out}

/* ---------- 7. CANTIDADES Y SUSTITUCIONES ---------- */
function resolve(key,q){const sb=S.subs[key];if(sb&&SUBS[key]){const a=SUBS[key].find(x=>x[0]===sb);if(a)return[a[0],q*a[1]]}return[key,q]}
function scale(){return S.settings.portion}
function fmt(u,q){if(u==="g"||u==="ml"){const v=q>=50?Math.round(q/10)*10:Math.round(q/5)*5;if(v>=1000)return(v/1000).toFixed(2).replace(/0+$/,"").replace(/\.$/,"").replace(".",",")+(u==="g"?" kg":" l");return v+" "+u}
 const r=Math.max(.5,Math.round(q*2)/2);const n=Math.floor(r);const s=(n?n:"")+(n&&r%1?" ":"")+(r%1?"½":"");const lab={ud:["unidad","unidades"],cda:["cucharada","cucharadas"],cdta:["cucharadita","cucharaditas"],lata:["lata","latas"]}[u];return s+" "+(r<=1?lab[0]:lab[1])}
function shopFmt(u,q){if(u==="g"||u==="ml"){const v=Math.ceil(q/50)*50;return v>=1000?(v/1000).toString().replace(".",",")+(u==="g"?" kg":" l"):v+" "+u}
 const n=Math.ceil(q-.001);const lab={ud:["unidad","unidades"],cda:["cucharada","cucharadas"],cdta:["cucharadita","cucharaditas"],lata:["lata","latas"]}[u];return n+" "+(n===1?lab[0]:lab[1])}

const dayLog=k=>(S.log[k]=S.log[k]||{done:{},skip:{},water:0});
function seedDemo(){const t=today();const hung=[2,5],tired=[3];
 for(let i=10;i>=1;i--){const k=addD(t,-i);const l=dayLog(k);const slots=ORDER;slots.forEach((s,j)=>{if((i*7+j*3)%11===0){l.skip[s]=true;return}
  l.done[s]={t:SLOTS[s].n&&DEF.settings.times[s],energy:tired.includes(i)&&s==="comida"?"cansada":(i+j)%4===0?"regular":"bien",hunger:hung.includes(i)&&s==="media"?"mucha":"normal",inc:(i===4&&s==="comida")?["Dolor de rodilla o cadera"]:[],note:""}});l.water=4+(i%4)}
  S.weights=[{date:"2026-10-02",kg:84.0},{date:"2026-10-16",kg:83.6},{date:"2026-10-30",kg:83.3},{date:"2026-11-06",kg:83.0}]}

/* ---------- 9. ADAPTACIÓN AUTOMÁTICA (reglas simples, reversibles, solo cambios pequeños) ---------- */
function lastDays(n){const t=today();return Array.from({length:n},(_,i)=>addD(t,-i))}
function adapt(){const last=S.adaptLog.length?S.adaptLog[S.adaptLog.length-1].date:"";if(last&&last>addD(today(),-7))return;
 let hunger=0,tired=0,lowE=0,skips=0;lastDays(7).forEach(k=>{const l=S.log[k];if(!l)return;skips+=Object.keys(l.skip||{}).length;Object.values(l.done).forEach(d=>{if(d.hunger==="mucha")hunger++;if(d.energy==="cansada"){tired++;lowE++}})});
 const st=S.settings,add=(msg,key,prev)=>S.adaptLog.push({date:today(),msg,key,prev});
 if(hunger>=3&&st.meals<5){add("Ha tenido mucha hambre 3 o más veces esta semana: pasamos a 5 comidas al día.","meals",st.meals);st.meals=5}
 else if(tired>=3&&st.maxDif>1){add("Ha estado cansada varias veces: simplificamos las recetas (solo fáciles).","maxDif",st.maxDif);st.maxDif=1}
 else if(lowE>=3&&st.portion<1.1){add("Poca energía repetida: subimos un poco las raciones (+10 %). Conviene avisar al médico si continúa.","portion",st.portion);st.portion=Math.round((st.portion+.1)*10)/10}
 else if(skips>=6){add("Se ha saltado muchas comidas: revisa horarios o dificultad en el panel familiar.","none",null)}
 save()}
function alerts(){const out=[];lastDays(7).forEach(k=>{const l=S.log[k];if(!l)return;Object.entries(l.done).forEach(([s,d])=>(d.inc||[]).forEach(i=>{if(i==="Mareo"||i==="Dolor de rodilla o cadera"||i==="No me sentó bien")out.push({k,s,i,note:d.note})}))});return out}

function nextSlot(plan,k){const now=new Date();const hm=pad(now.getHours())+":"+pad(now.getMinutes());const l=dayLog(k);const sl=Object.keys(plan);
 for(const s of sl){if(!l.done[s]&&!l.skip[s]&&S.settings.times[s]>=addMin(hm,-60))return s}return sl.find(s=>!l.done[s]&&!l.skip[s])||null}
function addMin(hm,n){let [h,m]=hm.split(":").map(Number);let t=Math.max(0,h*60+m+n);return pad(Math.floor(t/60))+":"+pad(t%60)}

function vHoy(){const k=today(),plan=planFor(k),l=dayLog(k),sl=Object.keys(plan);const done=sl.filter(s=>l.done[s]).length;const nx=nextSlot(plan,k);
 const h=new Date().getHours();const hi=h<13?"Buenos días":h<20?"Buenas tardes":"Buenas noches";
 let h1=`<p class="sub">${longDate(k)}</p><h1>${hi}${S.settings.name?", "+esc(S.settings.name):""}</h1>`;
 if(nx){const r=plan[nx];h1+=`<div class="card hero"><div class="sub">Ahora te toca · ${SLOTS[nx].n} · ${S.settings.times[nx]}</div><h1>${SLOTS[nx].i} ${esc(r.name)}</h1><div class="sub">⏱ ${r.min} min · ${DIF[r.dif]}</div><button class="btn" data-act="recipe" data-d="${k}" data-s="${nx}">Ver cómo se hace</button></div>`}
 else h1+=`<div class="card hero"><h1>¡Hoy lo has hecho muy bien! 🎉</h1><div class="sub">Has completado todas tus comidas.</div></div>`;
 h1+=`<div class="card"><div class="row"><div class="grow"><b>Tu día</b><div class="sub">${done} de ${sl.length} comidas</div></div>${streak()>1?`<span class="tag">🔥 ${streak()} días seguidos</span>`:""}</div><div class="bar" style="margin-top:8px"><i style="width:${done/sl.length*100}%"></i></div><div style="margin-top:8px"><b>${cheer(done,sl.length)}</b></div></div>`;
 h1+=sl.map(s=>{const r=plan[s],ok=l.done[s],sk=l.skip[s];return `<div class="card meal ${ok?"done":""}"><div class="ico">${SLOTS[s].i}</div><div class="grow" data-act="recipe" data-d="${k}" data-s="${s}"><div class="sub">${SLOTS[s].n} · ${S.settings.times[s]}</div><div class="name">${esc(r.name)}</div>${sk?`<span class="tag">Me lo salté</span>`:""}</div><button class="check ${ok?"on":""}" data-act="done" data-d="${k}" data-s="${s}" aria-label="Marcar ${SLOTS[s].n} como hecho">${ok?"✓":""}</button></div>`}).join("");
 h1+=`<div class="card"><b>💧 Agua de hoy</b><div class="sub">Intenta llegar a 6-8 vasos, poco a poco.</div><div class="stepper" style="margin-top:8px"><button data-act="water" data-n="-1" aria-label="Quitar un vaso">−</button><b>${l.water||0} 🥛</b><button data-act="water" data-n="1" aria-label="Añadir un vaso">+</button></div></div>`;
 h1+=`<div class="notice">Menú orientativo. Si te mareas o encuentras mal, para y avisa a tu familia o a tu médico.</div>`;return h1}

/* Motivación: racha de días (≥ la mitad de las comidas hechas) y mensaje de ánimo */
function streak(){let n=0;const t=today(),need=Math.ceil(activeSlots().length/2);for(let i=0;i<60;i++){const l=S.log[addD(t,-i)];const c=l?Object.keys(l.done).length:0;if(c>=need)n++;else if(i===0)continue;else break}return n}
function cheer(d,n){if(d===0)return"Empieza por lo que toca ahora. ¡Tú puedes! 💪";if(d>=n)return"¡Día completo! Estás creando un buen hábito 🌟";if(d>=n/2)return"¡Vas muy bien! Ya más de la mitad 👏";return"¡Buen comienzo! Sigue así 😊"}

function makeICS(){const st=S.settings,d=today().replace(/-/g,""),mon=mondayOf(today()).replace(/-/g,"");const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Mi Menu//ES//","CALSCALE:GREGORIAN"];
 const ev=(id,title,hm,rule,date)=>L.push("BEGIN:VEVENT","UID:"+id+"@mimenu","DTSTAMP:"+d+"T000000Z","DTSTART:"+date+"T"+hm.replace(":","")+"00","DURATION:PT15M","RRULE:"+rule,"SUMMARY:"+title,"DESCRIPTION:Abre Mi Menu para ver que toca","BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+title,"TRIGGER:-PT"+st.remind.lead+"M","END:VALARM","END:VEVENT");
 activeSlots().forEach(s=>ev("slot-"+s,"Mi Menu: "+SLOTS[s].n,st.times[s],"FREQ=DAILY",d));

 return h}

 h+=`<div class="card">`+used.map(k=>`<button class="chip ${subPick===k?"on":""}" data-act="pick" data-k="${k}">${esc(ING[k][0])}${S.subs[k]?" ✓":""}</button>`).join("")+`</div>`;
 if(subPick){h+=`<h2>En vez de ${esc(ING[subPick][0])} puedes usar:</h2>`+SUBS[subPick].map(([a,f,n])=>`<div class="card"><b>${esc(ING[a][0])}</b><div class="sub">${esc(n)}</div><button class="btn ${S.subs[subPick]===a?"":"alt"}" data-act="usesub" data-k="${subPick}" data-a="${a}">${S.subs[subPick]===a?"✓ Lo estoy usando":"Usar este"}</button></div>`).join("")+(S.subs[subPick]?`<button class="btn danger" data-act="unsub" data-k="${subPick}">Volver al ingrediente de siempre</button>`:"")}
 const act=Object.entries(S.subs);if(act.length)h+=`<h2>Cambios activos</h2><div class="card">${act.map(([k,a])=>`<div class="row" style="padding:6px 0"><div class="grow">${esc(ING[k][0])} → <b>${esc(ING[a][0])}</b></div><button class="btn danger small" data-act="unsub" data-k="${k}">Quitar</button></div>`).join("")}<div class="sub">Se aplican en las recetas y en la lista de la compra.</div></div>`;return h}

function vMas(){const st=S.settings;if(supOpen)return vSup();
 return `<h1>Más</h1><div class="card"><b>Tamaño de letra</b><div class="stepper" style="margin-top:8px"><button data-act="font" data-n="-1" aria-label="Letra más pequeña">A−</button><b>${["Pequeña","Normal","Grande","Muy grande","Enorme"][st.font]}</b><button data-act="font" data-n="1" aria-label="Letra más grande">A+</button></div><button class="btn ${st.contrast?"":"alt"}" data-act="contrast">${st.contrast?"✓ Alto contraste activado":"Activar alto contraste"}</button></div>
 <button class="btn" data-act="ics">🔔 Poner recordatorios en el móvil</button>
 <button class="btn alt" data-act="hist">📝 Mi registro de estos días</button>
 <button class="btn alt" data-act="weight">⚖️ Apuntar mi peso</button>
 <button class="btn alt" data-act="help">❓ ¿Cómo funciona esto?</button>
 <button class="btn" data-act="supgo">👨‍👩‍👧 Panel de la familia</button>
 <div class="notice">Este menú es orientativo y está pendiente de que lo valide su médico o nutricionista. No sustituye ninguna indicación médica.</div>`}

/* ---------- 11. PANEL FAMILIAR ---------- */
function stats(){let planned=0,done=0,skip=0;lastDays(7).forEach(k=>{const l=S.log[k];const n=activeSlots().length;planned+=n;if(l){done+=Object.keys(l.done).length;skip+=Object.keys(l.skip).length}});return{planned,done,skip,pct:planned?Math.round(done/planned*100):0}}
function dayKcal(k){return Math.round(Object.values(planFor(k)).reduce((a,r)=>a+r.kcal,0)*S.settings.portion)}
function chart(){const w=[...S.weights].sort((a,b)=>a.date.localeCompare(b.date));if(w.length<2)return `<div class="sub">Aún no hay suficientes pesos.</div>`;const min=Math.min(...w.map(x=>x.kg))-.5,max=Math.max(...w.map(x=>x.kg))+.5;const W=300,H=110;const pts=w.map((x,i)=>[10+i*(W-20)/(w.length-1),H-10-(x.kg-min)/(max-min)*(H-30)]);
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolución del peso"><polyline fill="none" stroke="var(--brand)" stroke-width="3" points="${pts.map(p=>p.join(",")).join(" ")}"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--brand)"/><text x="${p[0]}" y="${p[1]-8}" font-size="10" text-anchor="middle" fill="currentColor">${w[i].kg}</text>`).join("")}</svg>`}
function vSup(){const st=S.settings,s=stats(),al=alerts();const mon=mondayOf(addD(today(),editWeek*7));
 let h=`<div class="row"><h1 class="grow">Panel de la familia</h1><button class="btn alt small" data-act="supout">Salir</button></div>`;
 if(S.demo)h+=`<div class="demo">Hay datos de ejemplo cargados (registro y pesos inventados). <button class="btn small alt" data-act="cleardemo">Borrar datos de ejemplo</button></div>`;
 h+=`<div class="notice"><b>Pendiente:</b> el plan (≈ ${dayKcal(today())} kcal/día) debe validarlo un médico o nutricionista antes de aplicarlo. El plan está pensado como un déficit moderado.</div>`;
 if(al.length)h+=`<div class="card" style="border-color:var(--bad)"><b>⚠️ Avisos de la última semana</b>${al.map(a=>`<div class="sub">${longDate(a.k)} · ${SLOTS[a.s].n}: <b>${esc(a.i)}</b></div>`).join("")}<div class="sub">Si hay mareos repetidos, consulta con su médico.</div></div>`;
 if(S.adaptLog.length)h+=`<details><summary>🔧 Cambios automáticos (${S.adaptLog.length})</summary>${S.adaptLog.slice().reverse().map((a,i)=>`<div style="padding:6px 0;border-top:1px solid var(--line)"><div class="sub">${longDate(a.date)}</div>${esc(a.msg)}${a.key!=="none"?`<br><button class="btn small alt" data-act="undo" data-i="${S.adaptLog.length-1-i}">Deshacer</button>`:""}</div>`).join("")}</details>`;
 h+=`<div class="grid2"><div class="card"><div class="sub">Cumplimiento 7 días</div><div class="kpi">${s.pct}%</div><div class="sub">${s.done}/${s.planned} · ${s.skip} saltadas</div></div><div class="card"><div class="sub">Último peso</div><div class="kpi">${[...S.weights].sort((a,b)=>b.date.localeCompare(a.date))[0]?.kg||"—"} kg</div><div class="sub">objetivo: bajar poco a poco</div></div></div><div class="card"><b>Peso</b>${chart()}</div>`;
 h+=`<details><summary>🍽️ Comidas, raciones y horarios</summary>
 <b>Comidas al día</b><div>${[3,4,5].map(n=>`<button class="chip ${st.meals===n?"on":""}" data-act="meals" data-n="${n}">${n}</button>`).join("")}</div>
 <b>Raciones</b><div class="stepper"><button data-act="portion" data-n="-0.1">−</button><b>${Math.round(st.portion*100)}%</b><button data-act="portion" data-n="0.1">+</button></div><div class="sub">Entre 80 % y 120 %. Cambiar raciones cambia calorías: coméntalo con el nutricionista.</div>
 <b>Personas para las que se cocina</b><div class="stepper"><button data-act="people" data-n="-1">−</button><b>${st.people}</b><button data-act="people" data-n="1">+</button></div>
 <b>Dificultad máxima de recetas</b><div>${[1,2,3].map(n=>`<button class="chip ${st.maxDif===n?"on":""}" data-act="dif" data-n="${n}">${DIF[n]}</button>`).join("")}</div>
 <b>Horarios</b>${ORDER.map(o=>`<label class="sub">${SLOTS[o].i} ${SLOTS[o].n}<input type="time" value="${st.times[o]}" data-act="time" data-s="${o}"></label>`).join("")}</details>`;
 h+=`<details><summary>🚫 Alimentos excluidos</summary><div class="sub">Toca para excluir o permitir. Las recetas con un alimento excluido no se proponen.</div>${[...new Set(R.flatMap(r=>r.ing.map(x=>x[0])).concat(st.excluded))].filter(k=>!STAPLES.has(k)).sort((a,b)=>ING[a][0].localeCompare(ING[b][0])).map(k=>`<button class="chip ${st.excluded.includes(k)?"off":""}" data-act="excl" data-k="${k}">${st.excluded.includes(k)?"🚫 ":""}${esc(ING[k][0])}</button>`).join("")}</details>`;
 h+=`<details><summary>📅 Editar el plan de la semana</summary><div class="row"><button class="btn alt small" data-act="wk" data-n="-1">←</button><button class="btn alt small" data-act="wk" data-n="1">→</button><span class="sub">Semana del ${pd(mon).getDate()}/${pd(mon).getMonth()+1}</span></div>`+
 Array.from({length:7},(_,i)=>{const k=addD(mon,i),plan=planFor(k);return `<div style="border-top:1px solid var(--line);padding:6px 0"><b>${longDate(k)}</b> <span class="sub">${dayKcal(k)} kcal</span>${Object.entries(plan).map(([sl,r])=>`<label class="sub">${SLOTS[sl].n}<select data-act="override" data-d="${k}" data-s="${sl}">${R.filter(x=>x.slot===sl).map(x=>`<option value="${x.id}" ${x.id===r.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select></label>`).join("")}</div>`}).join("")+`<button class="btn danger small" data-act="resetplan">Restablecer plan automático</button></details>`;
 h+=`<details><summary>🔔 Recordatorios</summary><button class="btn ${st.remind.on?"":"alt"}" data-act="remind">${st.remind.on?"✓ Activados":"Activar recordatorios"}</button><label class="sub">Avisar antes de la comida<select data-act="lead">${[0,5,10,15,30].map(n=>`<option value="${n}" ${st.remind.lead===n?"selected":""}>${n===0?"A la hora":n+" minutos antes"}</option>`).join("")}</select></label><button class="btn" data-act="ics">🔔 Crear recordatorios en el calendario del móvil</button><div class="sub">Gratis y sin servicios externos: se descarga un archivo y el móvil lo añade a su Calendario. Suena aunque la app esté cerrada. Si cambias los horarios, vuelve a crearlo y borra los eventos “Mi Menu” antiguos.</div></details>`;
 h+=`<details><summary>📋 Registro detallado</summary>${logTable()}</details>`;
 h+=`<details><summary>🔒 Perfil y datos</summary><label class="sub">Nombre (opcional)<input type="text" value="${esc(st.name)}" data-act="name"></label><label class="sub">PIN del panel<input type="text" inputmode="numeric" value="${esc(st.pin)}" data-act="pin"></label><button class="btn alt" data-act="export">⬇️ Guardar copia de seguridad</button><label class="btn alt" style="cursor:pointer">⬆️ Cargar copia<input type="file" accept=".json" data-act="import" hidden></label><button class="btn danger" data-act="reset">Borrar todo y empezar de cero</button></details>`;
 return h}
function logTable(){const rows=lastDays(10).map(k=>{const l=S.log[k];if(!l)return "";const p=Object.entries(l.done);return `<tr><td>${longDate(k).split(" de ")[0]}</td><td>${p.length}✓ ${Object.keys(l.skip).length?Object.keys(l.skip).length+"✗":""}</td><td>${[...new Set(p.flatMap(([_,d])=>(d.inc||[]).concat(d.hunger==="mucha"?["Hambre"]:[],d.energy==="cansada"?["Cansada"]:[])))].join(", ")||"—"}</td></tr>`}).join("");return `<table><tr><th>Día</th><th>Comidas</th><th>Incidencias</th></tr>${rows}</table>`}

/* ---------- 12. RECETA Y HOJAS ---------- */
function openRecipe(k,s){const plan=planFor(k),r=plan[s];if(!r)return;const l=dayLog(k);
 const items=r.ing.map(([key,q])=>{const [rk,rq]=resolve(key,q);const swapped=rk!==key;return `<li><span>${esc(ING[rk][0])}${swapped?` <span class="tag">cambiado</span>`:""}${ING[rk][3]?`<div class="sub">${esc(ING[rk][3])}</div>`:""}</span><span class="row"><span class="q">${fmt(ING[rk][2],rq*scale()*(S.settings.people>1?1:1))}</span>${SUBS[key]?`<button class="btn alt small" style="margin:0" data-act="subfor" data-k="${key}" aria-label="Cambiar ${esc(ING[key][0])}">🔄</button>`:""}</span></li>`}).join("");
 $("#layer").innerHTML=`<div class="modal"><div class="in"><button class="btn alt small" data-act="close">← Volver</button><div class="sub">${SLOTS[s].i} ${SLOTS[s].n} · ${longDate(k)}</div><h1>${esc(r.name)}</h1><div><span class="tag">⏱ ${r.min} min</span><span class="tag">${DIF[r.dif]}</span></div>
 ${r.dent?`<div class="notice">🦷 Si algún trozo te molesta con la dentadura, córtalo más pequeño o ráyalo.</div>`:""}
 <h2>Ingredientes${S.settings.people>1?` (por persona; cocinas para ${S.settings.people})`:""}</h2><ul class="ing">${items}</ul>
 <h2>Cómo se hace</h2><ol class="steps">${r.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>${r.tip?`<div class="card">💡 ${esc(r.tip)}</div>`:""}
 <button class="btn alt" data-act="speak" data-d="${k}" data-s="${s}">🔊 Leer en voz alta</button>
 <button class="btn ${l.done[s]?"alt":""}" data-act="done" data-d="${k}" data-s="${s}" data-close="1">${l.done[s]?"✓ Ya lo he comido (quitar)":"✅ Ya lo he comido"}</button></div></div>`}
function openFeel(k,s){const l=dayLog(k),d=l.done[s];if(!d)return;
 $("#layer").innerHTML=`<div class="sheet"><div class="in"><h1>¿Cómo te encuentras?</h1><b>Energía</b><div id="fe">${[["bien","😀 Bien"],["regular","😐 Regular"],["cansada","😫 Cansada"]].map(([v,t])=>`<button class="chip ${d.energy===v?"on":""}" data-act="fset" data-f="energy" data-v="${v}">${t}</button>`).join("")}</div><b>Hambre</b><div>${[["poca","🙂 Poca"],["normal","😐 Normal"],["mucha","😋 Mucha"]].map(([v,t])=>`<button class="chip ${d.hunger===v?"on":""}" data-act="fset" data-f="hunger" data-v="${v}">${t}</button>`).join("")}</div><b>¿Algo que contar?</b><div>${INC.map(v=>`<button class="chip ${(d.inc||[]).includes(v)?"on":""}" data-act="finc" data-v="${esc(v)}">${v}</button>`).join("")}</div><textarea id="fnote" rows="2" placeholder="Escribe aquí si quieres…">${esc(d.note||"")}</textarea><button class="btn" data-act="fsave">Listo</button></div></div>`;feelCtx={k,s}}
let feelCtx=null;
function sheetHelp(){$("#layer").innerHTML=`<div class="sheet"><div class="in"><h1>¿Cómo funciona?</h1><p><b>Hoy:</b> te dice qué toca ahora. Toca “Ver cómo se hace” y sigue los pasos.</p><p><b>✓:</b> cuando comas, pulsa el cuadrado verde. Después puedes decir cómo te sientes.</p><p><b>Semana:</b> ve qué comerás cada día.</p><p><b>Compra:</b> la lista ya está hecha. Marca lo que vayas metiendo al carro.</p><p><b>Sustituir:</b> si te falta un ingrediente, aquí te dice con qué cambiarlo.</p><p><b>Más:</b> letra más grande, alto contraste y tu peso.</p><button class="btn" data-act="close">Entendido</button></div></div>`}
function sheetWeight(){$("#layer").innerHTML=`<div class="sheet"><div class="in"><h1>Apuntar mi peso</h1><input type="number" id="wkg" inputmode="decimal" step="0.1" placeholder="Ej.: 83,2"><div class="sub">Pésate una vez por semana, por la mañana y en ayunas.</div><button class="btn" data-act="wsave">Guardar</button><button class="btn alt" data-act="close">Cancelar</button></div></div>`}
function sheetHist(){const rows=lastDays(10).map(k=>{const l=S.log[k];if(!l)return "";return `<div class="card"><b>${longDate(k)}</b><div class="sub">${Object.keys(l.done).length} comidas · ${l.water||0} vasos de agua${Object.keys(l.skip).length?" · "+Object.keys(l.skip).length+" saltadas":""}</div></div>`}).join("");$("#layer").innerHTML=`<div class="modal"><div class="in"><button class="btn alt small" data-act="close">← Volver</button><h1>Mi registro</h1>${rows}</div></div>`}
function sheetPin(){$("#layer").innerHTML=`<div class="sheet"><div class="in"><h1>Panel de la familia</h1><div class="sub">Escribe el PIN (en la demo es 1234).</div><input type="text" id="pin" inputmode="numeric" maxlength="8" autocomplete="off"><button class="btn" data-act="pinok">Entrar</button><button class="btn alt" data-act="close">Cancelar</button></div></div>`}
function toast(msg,fn){const t=document.createElement("div");t.className="toast";t.textContent=msg;t.onclick=()=>{t.remove();fn&&fn()};document.body.appendChild(t);setTimeout(()=>t.remove(),12000)}

/* ---------- 13. EVENTOS ---------- */
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.tagName==="SELECT"||b.type==="time"||b.type==="file"||b.type==="text")return;const a=b.dataset.act,D=b.dataset;const close=()=>{$("#layer").innerHTML=""};
 const A={
 nav(){view=D.v;supOpen=false;close();render()},close,
 recipe(){openRecipe(D.d,D.s)},
 done(){const l=dayLog(D.d);if(l.done[D.s]){delete l.done[D.s];save();close();render();return}delete l.skip[D.s];const n=new Date();l.done[D.s]={t:pad(n.getHours())+":"+pad(n.getMinutes()),energy:"bien",hunger:"normal",inc:[],note:""};save();render();openFeel(D.d,D.s)},
 water(){const l=dayLog(today());l.water=Math.max(0,(l.water||0)+Number(D.n));save();render()},
 wk(){editWeek=D.n==="0"?0:editWeek+Number(D.n);render()},shopwk(){shopWeek=Number(D.n);render()},
 shopck(){S.shop[D.w][D.k]=b.checked;save();render()},
 share(){const t=shopText();if(navigator.share)navigator.share({text:t}).catch(()=>{});else window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank")},
 copy(){navigator.clipboard&&navigator.clipboard.writeText(shopText()).then(()=>toast("Lista copiada ✓"))},
 pick(){subPick=D.k;render()},subfor(){close();subPick=D.k;view="sustituir";render()},
 usesub(){S.subs[D.k]=D.a;save();render()},unsub(){delete S.subs[D.k];save();render()},
 font(){S.settings.font=Math.min(4,Math.max(0,S.settings.font+Number(D.n)));save();render()},contrast(){S.settings.contrast=!S.settings.contrast;save();render()},
 ics(){const u=URL.createObjectURL(new Blob([makeICS()],{type:"text/calendar"}));const x=document.createElement("a");x.href=u;x.download="recordatorios-mi-menu.ics";x.click();$("#layer").innerHTML=`<div class="sheet"><div class="in"><h1>Casi está</h1><p>1. Abre el archivo que se acaba de descargar.</p><p>2. Elige <b>Calendario</b> y pulsa <b>Añadir</b>.</p><p>Desde mañana el móvil te avisará a la hora de cada comida.</p><button class="btn" data-act="close">Entendido</button></div></div>`},
 help:sheetHelp,weight:sheetWeight,hist:sheetHist,supgo(){sheetPin()},
 pinok(){if($("#pin").value===S.settings.pin){supOpen=true;close();render()}else{toast("PIN incorrecto")}},supout(){supOpen=false;render()},
 wsave(){const v=parseFloat(String($("#wkg").value).replace(",","."));if(v>30&&v<250){S.weights.push({date:today(),kg:Math.round(v*10)/10});save();close();toast("Peso guardado ✓");render()}},
 fset(){const d=dayLog(feelCtx.k).done[feelCtx.s];d[D.f]=D.v;save();openFeel(feelCtx.k,feelCtx.s)},
 finc(){const d=dayLog(feelCtx.k).done[feelCtx.s];d.inc=d.inc||[];const i=d.inc.indexOf(D.v);i<0?d.inc.push(D.v):d.inc.splice(i,1);save();openFeel(feelCtx.k,feelCtx.s)},
 fsave(){const d=dayLog(feelCtx.k).done[feelCtx.s];d.note=$("#fnote").value;save();close();adapt();render();toast("¡Anotado! Gracias 😊")},
 speak(){const r=planFor(D.d)[D.s];speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(r.name+". "+r.steps.map((s,i)=>"Paso "+(i+1)+". "+s).join(" "));u.lang="es-ES";u.rate=.9;speechSynthesis.speak(u)},
 meals(){S.settings.meals=Number(D.n);save();render()},portion(){S.settings.portion=Math.min(1.2,Math.max(.8,Math.round((S.settings.portion+Number(D.n))*10)/10));save();render()},people(){S.settings.people=Math.min(8,Math.max(1,S.settings.people+Number(D.n)));save();render()},dif(){S.settings.maxDif=Number(D.n);save();render()},
 excl(){const x=S.settings.excluded,i=x.indexOf(D.k);i<0?x.push(D.k):x.splice(i,1);save();render()},
 resetplan(){S.overrides={};save();render()},
 remind(){S.settings.remind.on=!S.settings.remind.on;if(S.settings.remind.on&&"Notification"in window&&Notification.permission==="default")Notification.requestPermission();save();render()},
 undo(){const a=S.adaptLog[Number(D.i)];if(a&&a.key!=="none"){S.settings[a.key]=a.prev;a.key="none";a.msg+=" (deshecho)";save();render()}},
 cleardemo(){S.log={};S.weights=[];S.demo=false;save();render()},
 export(){const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));const x=document.createElement("a");x.href=u;x.download="mi-menu-copia.json";x.click()},
 reset(){if(confirm("¿Seguro que quieres borrar todo?")){localStorage.removeItem(KEY);load();supOpen=false;render()}}
 };A[a]&&A[a]()});
document.addEventListener("change",e=>{const t=e.target,a=t.dataset.act;if(!a)return;const D=t.dataset;
 if(a==="override"){S.overrides[D.d]=S.overrides[D.d]||{};S.overrides[D.d][D.s]=t.value;save();render()}
 else if(a==="time"){S.settings.times[D.s]=t.value;save()}
 else if(a==="lead"){S.settings.remind.lead=Number(t.value);save()}
 else if(a==="name"){S.settings.name=t.value;save()}
 else if(a==="pin"){if(t.value.length>=4){S.settings.pin=t.value;save()}}
 else if(a==="import"){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(j.settings){S=j;save();render()}}catch(_){toast("Archivo no válido")}};r.readAsText(f)}});

/* ---------- 14. RECORDATORIOS (con la app abierta) ---------- */
function checkReminders(){if(!S.settings.remind.on)return;const now=new Date(),k=today();const plan=planFor(k);
 for(const s of Object.keys(plan)){const t=addMin(S.settings.times[s],-S.settings.remind.lead);const hm=pad(now.getHours())+":"+pad(now.getMinutes());const id="r"+k+s;
  if(hm===t&&!sessionStorage.getItem(id)){sessionStorage.setItem(id,1);const msg=`${SLOTS[s].i} ${SLOTS[s].n}: ${plan[s].name}`;toast(msg,()=>openRecipe(k,s));try{navigator.vibrate&&navigator.vibrate([200,100,200]);if("Notification"in window&&Notification.permission==="granted")new Notification("Mi Menú",{body:msg})}catch(_){}}}}
setInterval(checkReminders,20000);

if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
load();adapt();render();
</script>
</body>
